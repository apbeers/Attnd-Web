{% load static design %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% include 'home/_icons.html' %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event not found · Attnd</title>
  <meta name="theme-color" content="#431f86">
  {% stylesheets "site" %}
</head>
<body class="site">
<main class="join-page" data-reading>
  <div class="join-card join-card--message">
    <a class="brand" href="{% url 'home:home_page' %}">attnd<span>.</span></a>
    <h1>We couldn't find that event</h1>
    <p class="muted">{% if code %}No event uses the code <strong class="mono">{{ code }}</strong>.{% endif %} Check the code on the poster or with the organizers.</p>
    <form id="join-code-form" class="join-form">
      <input name="code" placeholder="Event code" autocomplete="off" autocapitalize="characters" aria-label="Event code">
      <button class="button button--primary">Go</button>
    </form>
  </div>
</main>
<script nonce="{{ csp_nonce }}">
document.getElementById('join-code-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const c = e.target.code.value.trim();
  if (c) location.href = '/join/' + encodeURIComponent(c.toUpperCase()) + '/';
});
</script>
</body>
</html>
