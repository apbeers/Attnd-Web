{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join {{ event.name }} — Attnd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="{% static 'home/img/favicon.png' %}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">

            <h1 class="mb-1">{{ event.name }}</h1>
            <p class="text-muted mb-1">Download the Attnd app to join this event.</p>
            <p class="mb-4">
                Event code: <strong class="font-monospace fs-5">{{ event.event_code }}</strong>
            </p>

            <div class="d-grid gap-3">
                <a href="{{ ios_url }}" class="btn btn-dark btn-lg">
                    Download on the App Store
                </a>
                <a href="{{ android_url }}" class="btn btn-success btn-lg">
                    Get it on Google Play
                </a>
            </div>

            <p class="text-muted mt-4 small">
                Already have the app? Open it and enter the code above.
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
