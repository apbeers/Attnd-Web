name: Distribute — iOS Prod (App Store)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/distribute-ios-prod.yml'

permissions:
  contents: read

jobs:
  # Integration tests must pass before we submit anything to the App Store.
  # The integration-tests workflow runs separately; this job polls its status.
  # Simplest approach: require integration-tests.yml to succeed on the same SHA
  # using `workflow_run` as a blocking dependency (configured in integration-tests.yml).
  # For now, prod distribution is also gated by a manual approval on the ios-prod environment.

  test:
    name: iOS Unit Tests
    runs-on: macos-15
    env:
      XCODE_VERSION: '16.3'
      SCHEME: Attnd
      PROJECT: ios/Attnd.xcodeproj
      DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ios-derived-${{ hashFiles('ios/**/*.swift', 'ios/**/*.xcodeproj/**') }}
          restore-keys: ios-derived-
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  distribute:
    name: Archive & Submit to App Store
    runs-on: macos-15
    needs: test
    environment: ios-prod   # ← manual approval gate
    env:
      XCODE_VERSION: '16.3'
      SCHEME: Attnd
      PROJECT: ios/Attnd.xcodeproj
      ARCHIVE_PATH: build/Attnd.xcarchive
      EXPORT_PATH: build/export
      KEYCHAIN_NAME: ci-signing.keychain
      KEYCHAIN_PASSWORD: ci-temp

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ios-derived-${{ hashFiles('ios/**/*.swift', 'ios/**/*.xcodeproj/**') }}
          restore-keys: ios-derived-

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychain -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/prod.mobileprovision

      - name: Write App Store Connect API key
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_BASE64" | base64 --decode > \
            ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Write xcconfig with API key
        run: |
          echo "ATTND_API_KEY=${{ secrets.IOS_ATTND_API_KEY }}" \
            > ios/Config/Secrets.xcconfig

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            -configuration Release \
            | xcpretty --color

      - name: Export IPA (App Store)
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            | xcpretty --color

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(find $EXPORT_PATH -name '*.ipa')" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          echo "Submitted to App Store Connect. Enable for external testing or App Review in App Store Connect."

      - name: Clean up keychain and secrets
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f ios/Config/Secrets.xcconfig
          rm -f ~/.appstoreconnect/private_keys/*.p8
