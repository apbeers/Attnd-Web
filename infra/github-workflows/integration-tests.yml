name: Integration Tests

# Runs automatically after the web dev deploy completes on develop.
# Also available as a manual trigger at any time (e.g. before merging to main).

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to test against'
        required: true
        default: 'dev'
        type: choice
        options: [dev, local]

  workflow_run:
    workflows: ["Deploy — Web Dev"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  checks: write

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Web — full Django test suite
  # Spins up Postgres as a service so tests run against a real DB.
  # ---------------------------------------------------------------------------
  web-tests:
    name: Web — Django Tests
    runs-on: ubuntu-latest
    # If triggered by workflow_run, only proceed if the deploy succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: attnd_test
          POSTGRES_USER: attnd
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://attnd:test@localhost:5432/attnd_test
      SECRET_KEY: integration-test-secret
      API_KEY: integration-test-api-key
      DEBUG: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: web
        run: uv sync --frozen

      - name: Run migrations
        working-directory: web
        run: uv run python manage.py migrate --noinput

      - name: Run Django tests
        working-directory: web
        run: uv run python manage.py test --verbosity=2

  # ---------------------------------------------------------------------------
  # Job 2: Android — API contract tests
  # Runs Android unit tests (Robolectric, JVM only — no emulator) against
  # the dev environment URL. Tests exercise the full Retrofit client stack
  # with real HTTP responses, catching serialization mismatches early.
  # ---------------------------------------------------------------------------
  android-api-tests:
    name: Android — API Contract Tests
    runs-on: ubuntu-latest
    needs: web-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Write local.properties
        run: |
          cat > android/local.properties << EOF
          ATTND_API_KEY=${{ secrets.DEV_ATTND_API_KEY }}
          MAPS_API_KEY=ci-test-key
          EOF

      - name: Run unit tests (includes API contract tests)
        working-directory: android
        env:
          # Tests read this to point at the right backend.
          # Override to 'local' to test against a locally running server.
          ATTND_TEST_BASE_URL: https://dev.attnd.app
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-test-results
          path: android/app/build/reports/tests/

  # ---------------------------------------------------------------------------
  # Job 3: iOS — API contract tests
  # Runs iOS logic tests (no simulator boot required) against the dev
  # environment. Tests exercise APIClient.swift and all Decodable models
  # against real API responses.
  # ---------------------------------------------------------------------------
  ios-api-tests:
    name: iOS — API Contract Tests
    runs-on: macos-15
    needs: web-tests
    env:
      XCODE_VERSION: '16.3'
      PROJECT: ios/Attnd.xcodeproj
      SCHEME: AttndTests
      # Logic test target — no simulator boot needed
      DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ios-derived-${{ hashFiles('ios/**/*.swift', 'ios/**/*.xcodeproj/**') }}
          restore-keys: ios-derived-

      - name: Run iOS tests
        env:
          ATTND_TEST_BASE_URL: https://dev.attnd.app
          ATTND_API_KEY: ${{ secrets.DEV_ATTND_API_KEY }}
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -testPlan IntegrationTests \
            ATTND_TEST_BASE_URL="$ATTND_TEST_BASE_URL" \
            ATTND_API_KEY="$ATTND_API_KEY" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-test-results
          path: TestResults.xcresult

  # ---------------------------------------------------------------------------
  # Job 4: Smoke tests
  # A Python script that hits every API endpoint and validates responses
  # match the contract in API.md. Fast (~30s), easy to extend.
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: [android-api-tests, ios-api-tests]

    env:
      ATTND_BASE_URL: https://dev.attnd.app
      ATTND_API_KEY: ${{ secrets.DEV_ATTND_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx

      - name: Run smoke tests
        run: python infra/scripts/smoke_test.py

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [web-tests, android-api-tests, ios-api-tests, smoke-tests]
    if: always()

    steps:
      - name: Report results
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web Django tests     | ${{ needs.web-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android API tests    | ${{ needs.android-api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS API tests        | ${{ needs.ios-api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API smoke tests      | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail the summary job if any suite failed, so PR status is red
          if [[ "${{ needs.web-tests.result }}" != "success" ||
                "${{ needs.android-api-tests.result }}" != "success" ||
                "${{ needs.ios-api-tests.result }}" != "success" ||
                "${{ needs.smoke-tests.result }}" != "success" ]]; then
            echo "One or more integration suites failed — see above."
            exit 1
          fi
          echo "All integration suites passed ✓"
