name: Distribute — Android Dev (Play Store internal)

on:
  push:
    branches: [develop]
    paths:
      - 'android/**'
      - '.github/workflows/distribute-android-dev.yml'

permissions:
  contents: read

jobs:
  test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Write local.properties
        working-directory: android
        run: |
          echo "ATTND_API_KEY=ci-test-key" >> local.properties
          echo "MAPS_API_KEY=ci-test-key"  >> local.properties
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

  distribute:
    name: Build AAB & Upload to Play Store (internal track)
    runs-on: ubuntu-latest
    needs: test
    environment: android-dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks

      - name: Write signing.properties
        run: |
          cat > android/signing.properties << EOF
          STORE_FILE=keystore.jks
          STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Write local.properties
        run: |
          cat > android/local.properties << EOF
          ATTND_API_KEY=${{ secrets.ANDROID_ATTND_API_KEY }}
          MAPS_API_KEY=${{ secrets.ANDROID_MAPS_API_KEY }}
          EOF

      - name: Set version code to run number (dev builds are ephemeral)
        working-directory: android
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" > version.properties

      - name: Build release AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload to Play Store internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arcu.attnd
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/keystore.jks
          rm -f android/signing.properties
          rm -f android/local.properties
