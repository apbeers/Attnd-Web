name: Deploy — Web Prod

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/deploy-web-prod.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  terraform:
    name: Terraform Apply (prod)
    runs-on: ubuntu-latest
    needs: test
    environment: prod
    outputs:
      ecr_url:      ${{ steps.tf.outputs.ecr_repository_url }}
      ecs_cluster:  ${{ steps.tf.outputs.ecs_cluster }}
      ecs_service:  ${{ steps.tf.outputs.ecs_service }}
      rds_endpoint: ${{ steps.tf.outputs.rds_endpoint }}
      secret_arn:   ${{ steps.tf.outputs.app_secret_arn }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: "~1.7"
            terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=infra init \
            -backend-config=backends/prod.hcl \
            -input=false

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan \
            -var-file=environments/prod.tfvars \
            -var="db_password=${{ secrets.PROD_DB_PASSWORD }}" \
            -var="django_secret_key=${{ secrets.PROD_DJANGO_SECRET_KEY }}" \
            -var="attestation_jwt_secret=${{ secrets.PROD_ATTESTATION_JWT_SECRET }}" \
            -var="attnd_api_key=${{ secrets.PROD_ATTND_API_KEY }}" \
            -out=tfplan \
            -input=false

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Capture outputs
        id: tf
        run: |
          echo "ecr_repository_url=$(terraform -chdir=infra output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform -chdir=infra output -raw ecs_cluster)"               >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform -chdir=infra output -raw ecs_service)"               >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform -chdir=infra output -raw rds_endpoint)"             >> $GITHUB_OUTPUT
          echo "app_secret_arn=$(terraform -chdir=infra output -raw app_secret_arn)"         >> $GITHUB_OUTPUT

      - name: Update DATABASE_URL in Secrets Manager
        run: |
          DATABASE_URL=$(python3 -c "
          import urllib.parse
          pw = '${{ secrets.PROD_DB_PASSWORD }}'
          host = '${{ steps.tf.outputs.rds_endpoint }}'
          print(f'postgresql://attnd:{urllib.parse.quote(pw, safe=\"\")}@{host}:5432/attnd')
          ")
          SECRET_ARN="${{ steps.tf.outputs.app_secret_arn }}"
          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" --query SecretString --output text)
          UPDATED=$(echo "$CURRENT" | python3 -c "
          import json, sys, os
          s = json.load(sys.stdin)
          s['DATABASE_URL'] = os.environ['DATABASE_URL']
          print(json.dumps(s))
          " DATABASE_URL="$DATABASE_URL")
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$UPDATED"

  deploy:
    name: Build & Deploy (prod)
    runs-on: ubuntu-latest
    needs: terraform
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          ECR_URL: ${{ needs.terraform.outputs.ecr_url }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=$ECR_URL:cache \
            --cache-to   type=registry,ref=$ECR_URL:cache,mode=max \
            --tag $ECR_URL:$SHA \
            --tag $ECR_URL:latest \
            --push \
            web

      - name: Run database migrations
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster }}
        run: |
          NETWORK=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$CLUSTER" \
            --query 'services[0].networkConfiguration' \
            --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$CLUSTER" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"attnd","command":["uv","run","python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$EXIT" = "0" ] || { echo "Migrations failed (exit $EXIT)"; exit 1; }

      - name: Deploy new image
        env:
          CLUSTER: ${{ needs.terraform.outputs.ecs_cluster }}
          SERVICE: ${{ needs.terraform.outputs.ecs_service }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
          echo "Prod deploy complete ✓"
