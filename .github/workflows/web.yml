# Web pipeline
#   push to develop/main, or a PR      → checks + tests (against Postgres, like production)
#   push to develop      → deploy to the Heroku dev app        (environment: dev)
#   push to main         → deploy to the Heroku production app (environment: production)
#
# Setup: see SETUP.md. Uses only GitHub's own actions.
name: Web

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md']   # docs-only commits don't test or deploy
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  # A newer push supersedes an older run (its deploy would be replaced anyway). Production runs are
  # never cancelled half-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Checks & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: attnd
          POSTGRES_PASSWORD: attnd
          POSTGRES_DB: attnd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U attnd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      DEBUG: '1'
      SECRET_KEY: ci-only-secret
      API_KEY: ci-test-key
      DATABASE_URL: postgres://attnd:attnd@localhost:5432/attnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --frozen
      - name: Django system checks
        run: uv run python manage.py check
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (in parallel, one Postgres test database per CPU)
        run: uv run python manage.py test --parallel auto
      - name: Dependency freshness (informational)
        continue-on-error: true
        run: uv run python scripts/upgrade_deps.py --check

  deploy-dev:
    name: Deploy → Heroku dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://attnd-dev-7ab893f37020.herokuapp.com/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ vars.HEROKU_APP }}
        run: bash scripts/ci/heroku_deploy.sh

  deploy-prod:
    name: Deploy → Heroku production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://attnd.app/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ vars.HEROKU_APP }}
          HEALTH_URL: https://attnd.app/health/
        run: bash scripts/ci/heroku_deploy.sh
