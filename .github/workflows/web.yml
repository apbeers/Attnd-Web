# Web pipeline
#   push to develop/main, or a PR      → checks + tests (against Postgres, like production)
#   push to develop      → deploy to the Heroku dev app        (environment: dev)
#                          → then "Integration · dev": live tests (live_tests/) against the new dev deploy
#   push to main         → deploy to the Heroku production app (environment: production)
#   every push           → "Integration · prod": live tests against attnd.app with the DEMO-only CI key
#                          (API-008), in parallel with the tests; informational, never gates anything
#
# LEAN MODE (early build-out, Nov 2026): the two integration jobs run only when the repository variable
# CI_FULL is 'true' (they are skipped, costing no minutes, otherwise). Full pipeline + how to restore it:
# docs/CI_PIPELINES.md.
#
# Setup: see SETUP.md. Uses only GitHub's own actions.
name: Web

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']   # docs-only commits don't test or deploy
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  # A newer push supersedes an older run (its deploy would be replaced anyway). Production runs are
  # never cancelled half-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Checks & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: attnd
          POSTGRES_PASSWORD: attnd
          POSTGRES_DB: attnd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U attnd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      DEBUG: '1'
      SECRET_KEY: ci-only-secret
      API_KEY: ci-test-key
      DATABASE_URL: postgres://attnd:attnd@localhost:5432/attnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --frozen
      - name: Django system checks
        run: uv run python manage.py check
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (in parallel, one Postgres test database per CPU)
        run: uv run python manage.py test --parallel auto
      - name: Deprecation check (Django / Python deprecations are errors)
        run: uv run python -W error::DeprecationWarning -W error::PendingDeprecationWarning manage.py check
      - name: Dependency freshness (informational)
        continue-on-error: true
        run: uv run python scripts/upgrade_deps.py --check

  deploy-dev:
    name: Deploy → Heroku dev
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.attnd.app/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ vars.HEROKU_APP }}
          # Not the herokuapp.com hostname: that host serves only Studio sites (SITES_HOST).
          HEALTH_URL: https://dev.attnd.app/health/
        run: bash scripts/ci/heroku_deploy.sh

  deploy-prod:
    name: Deploy → Heroku production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://attnd.app/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ vars.HEROKU_APP }}
          HEALTH_URL: https://attnd.app/health/
        run: bash scripts/ci/heroku_deploy.sh

  integration-dev:
    name: Integration · dev
    # Tests the dev server this run just deployed. Gates nothing (it runs after the deploy).
    if: vars.CI_FULL == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATTND_IT_SERVER: dev.attnd.app
      ATTND_IT_KEY: ${{ secrets.ATTND_DEV_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Live tests against dev
        run: |
          [ -n "$ATTND_IT_KEY" ] || echo "::warning::ATTND_DEV_API_KEY is not set: the API tests are skipped (SETUP.md, CI keys)"
          python live_tests/run.py

  e2e-dev:
    name: E2E · dev (tickets)
    # Browser end-to-end of ticketing on dev with Stripe test mode (e2e/tickets_e2e.py). LEAN MODE: CI_FULL only.
    if: vars.CI_FULL == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      E2E_SERVER: https://dev.attnd.app
      E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
      E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Playwright
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Tickets end to end
        run: python e2e/tickets_e2e.py

  integration-prod:
    name: Integration · prod
    # Production as it is now, with the DEMO-only CI key. Runs alongside the tests and never gates a deploy:
    # a failure shows as a warning on the run.
    if: vars.CI_FULL == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      ATTND_IT_SERVER: attnd.app
      ATTND_IT_KEY: ${{ secrets.ATTND_PROD_CI_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Live tests against production
        run: |
          [ -n "$ATTND_IT_KEY" ] || echo "::warning::ATTND_PROD_CI_KEY is not set: the API tests are skipped (SETUP.md, CI keys)"
          if ! python live_tests/run.py; then
            echo "::warning::Production integration tests failed (informational; see the step summary)"
            echo "_Informational: production integration failures never block a deploy._" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
