# Ask Attnd quality harness (stage I): every scripted request in agent/harness.py against the real Claude model, in a
# throwaway Postgres (nothing touches dev or production data). Nightly and on demand. Needs the repository secret
# ANTHROPIC_HARNESS_KEY (an Anthropic key; a few cents per run); without it the job says so and stops.
name: Agent harness

on:
  schedule:
    - cron: '17 9 * * *'   # 3:17 AM America/Chicago (standard time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Ask Attnd scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: attnd
          POSTGRES_PASSWORD: attnd
          POSTGRES_DB: attnd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U attnd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      DEBUG: '1'
      SECRET_KEY: ci-only-secret
      API_KEY: ci-test-key
      DATABASE_URL: postgres://attnd:attnd@localhost:5432/attnd
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_HARNESS_KEY }}
      AGENT_HARNESS_LIVE: '1'
      AGENT_HARNESS_REPORT: harness-report.json
    steps:
      - name: Key present?
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_HARNESS_KEY is not set; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.run == 'true'
        with:
          python-version-file: .python-version
      - name: Install
        if: steps.key.outputs.run == 'true'
        run: python -m pip install --upgrade uv && uv sync --frozen
      - name: Scenarios
        if: steps.key.outputs.run == 'true'
        run: uv run python manage.py test agent.tests_harness.LiveHarnessTests -v 2
      - name: Report
        if: always() && steps.key.outputs.run == 'true'
        run: test -f harness-report.json && cat harness-report.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.run == 'true'
        with:
          name: harness-report
          path: harness-report.json
          if-no-files-found: ignore
