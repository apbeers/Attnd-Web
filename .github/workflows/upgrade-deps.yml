# Reusable dependency upgrade routine.
# Runs every Monday and on demand (Actions → "Upgrade dependencies" → Run workflow).
# Bumps every Python pin to its latest release, relocks, runs the tests, and opens a PR into develop.
name: Upgrade dependencies

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      DEBUG: '1'
      API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install --upgrade uv
      - name: Upgrade, relock and test
        id: upgrade
        run: |
          set -o pipefail
          uv run python scripts/upgrade_deps.py | tee /tmp/upgrade.txt
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open pull request
        if: steps.upgrade.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="deps/upgrade-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "Upgrade Python dependencies" -m "$(grep -- '->' /tmp/upgrade.txt || true)"
          git push --force origin "$branch"
          body=$(printf 'Automated dependency upgrade. The full test suite passed in the upgrade run.\n\n```\n%s\n```\n' "$(grep -- '->' /tmp/upgrade.txt || true)")
          gh pr create --base develop --head "$branch" --title "Upgrade Python dependencies ($(date +%Y-%m-%d))" --body "$body" \
            || gh pr edit "$branch" --body "$body"
