<style>
    .pac-container {
        z-index: 100000;
    }

    .list-group-item {
        font-size: 24px;
        color: white;
        background-color: var(--purple);
    }

    .list-group-item:hover {
        background-color: mediumpurple;
        color: white;
    }

    .list-group-item.active {
        background-color: mediumpurple;
    }

    .active {
        background-color: red;
    }


</style>


<div class="d-flex justify-content-between" style="flex-direction: column; height: 100vh; color: white">
    <div>
        <div class="d-flex justify-content-center" style="height: 80px">
            <h1 style="font-size: 65px">Attnd</h1>
        </div>
        <div class="list-group list-group-flush">
            {% for event in events %}
                <a href="{% url 'console:event' event_id=event.id %}" class="list-group-item list-group-item-action border-0 {% if event.id == selected_event.id %} active {% endif %}" style="text-align: center">
                    {{ event.name }}
                </a>
            {% endfor %}
        </div>
    </div>

    <div>
        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#eventCreateModal" style="width: 100%">
            + New Event
        </button>
        <hr>
        <div class="p-2">
            <h4>Hello, {{ selected_event.user.first_name }}</h4>
            <a>Account</a> - <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>
</div>


<div class="modal fade" id="eventCreateModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">New Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">

                    <script>
                        function initialize() {
                            var input = document.getElementById('id_address_new');
                            var autocomplete = new google.maps.places.Autocomplete(input);
                            autocomplete.addListener('place_changed', function () {
                                var place = autocomplete.getPlace();
                                document.getElementById('id_latitude_new').value = place.geometry.location.lat();
                                document.getElementById('id_longitude_new').value = place.geometry.location.lng();
                            })

                            const selectedItem = document.getElementsByClassName('pac-item-selected');
                            google.maps.event.addDomListener(input, 'keydown', function (e) {
                                if (e.keyCode === 13 && selectedItem.length !== 0) {
                                    e.preventDefault();
                                }
                            });
                        }

                        google.maps.event.addDomListener(window, 'load', initialize);
                    </script>

                    <form id="event-create-form" method="post" enctype="multipart/form-data" action="{% url 'console:event_create' %}">
                        {% csrf_token %}
                        {{ new_event_form.as_p }}
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="event-create-form" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
</div>
