{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email — Attnd</title>
  <link rel="stylesheet" href="{% static 'console/console.css' %}">
</head>
<body class="bg-light">
<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm" style="width:100%;max-width:420px;">
    <div class="card-body p-4">
      <h2 class="card-title mb-4 text-center">Check your email</h2>
      <p>If an account uses that email, a link to choose a new password is on its way. It works for 3 days and only once.</p>
      <p class="small text-muted">Nothing after a few minutes? Check spam, or make sure it's the email you sign in with.</p>
      <p class="text-center small mb-0"><a href="{% url 'login' %}">Back to sign in</a></p>
    </div>
  </div>
</div>
</body>
</html>
