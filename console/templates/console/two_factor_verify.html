{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-factor sign-in — Attnd</title>
  <link rel="stylesheet" href="{% static 'console/console.css' %}">
</head>
<body class="bg-light">
<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm" style="width:100%;max-width:420px;">
    <div class="card-body p-4">
      <h2 class="card-title mb-3 text-center">Enter your code</h2>
      <p class="text-muted small">Open your authenticator app and enter the 6-digit code for Attnd ({{ user.email }}). Lost your phone? Enter one of your recovery codes instead.</p>
      {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
      <form method="post">{% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3"><label class="form-label" for="id_code">Code</label>
          <input class="form-control font-monospace" type="text" name="code" id="id_code" inputmode="numeric"
                 autocomplete="one-time-code" maxlength="20" autofocus required></div>
        <div class="d-grid"><button class="btn btn-primary">Continue</button></div>
      </form>
      <form method="post" action="{% url 'logout' %}" class="text-center mt-3 mb-0">{% csrf_token %}
        <button class="btn btn-sm btn-link text-muted">Sign out</button></form>
    </div>
  </div>
</div>
</body>
</html>
