{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="{% static 'console/favicon.png' %}"/>
    <title>Attnd</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <style>
        {% include 'console/styles.css' %}
    </style>
</head>

<body>
<style>

    {#// # PAGE STRUCTURE#}
    .site {
        display: flex;
        min-height: 100vh;
    }

    .side-nav {
        width: 240px;
    }

    .site-content {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .content-header {
        background: #fff;
        height: 40px;
    }

    .content-topic {
        background: #fff;
        flex-grow: 1;
    }

    {#// # TITLES#}
    .flex-center {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .section-title {
        text-align: center;
    }
</style>


<div class="site">
    <nav class="side-nav">
        {% block sidebar %}
        {% endblock %}
    </nav>
    <div class="site-content">
        <div style="height: 140px;">
            {% block summary %}
            {% endblock %}
        </div>
        <div>
            {% block event_nav %}
            {% endblock %}
        </div>
        <div >
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>

</body>
</html>
