{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="{% static 'console/favicon.png' %}"/>
    <title>Attnd</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
</head>
<body>

    <div style="display: flex; height: 100vh">

        <div style="width: 300px; background-color: red">
            {% block sidebar %}
            {% endblock %}
        </div>

        <div style="width: 100%;">
            <div style="height: 140px; background-color: blue">
                {% block summary %}
                {% endblock %}
            </div>

            <div style="height: 70px; background-color: orange">
                {% block event_nav %}
                {% endblock %}
            </div>

            <div style="background-color: aqua; overflow: scroll">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

</body>
</html>
