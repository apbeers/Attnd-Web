{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="{% static 'home/img/favicon.png' %}"/>
    <title>Attnd</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC_f5kPFA1C2qrmwTEQNyOqRwNM7__CsH0&libraries=places,geometry"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        {% include 'console/styles.css' %}
    </style>
</head>

<body>


<div class="site">
    <nav class="side-nav" style="background-color: var(--purple);">
        {% block sidebar %}
        {% endblock %}
    </nav>
    <div class="site-content">
        <div style="height: 140px;">
            {% block summary %}
            {% endblock %}
        </div>
        <div>
            {% block event_nav %}
            {% endblock %}
        </div>
        <div class="container-fluid">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>

</body>
<style>

    {#// # PAGE STRUCTURE#}
    .site {
        display: flex;
        min-height: 100vh;
    }

    .side-nav {
        width: 240px;
    }

    .site-content {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .content-header {
        background: #fff;
        height: 40px;
    }

    .content-topic {
        background: #fff;
        flex-grow: 1;
    }

    {#// # TITLES#}
    .flex-center {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .section-title {
        text-align: center;
    }
</style>

</html>
