{% load console_tags %}{% if field.field.widget.input_type == 'checkbox' %}<div class="field field--check">
  {{ field }} <label for="{{ field.id_for_label }}">{{ field.label }}</label>
{% else %}<div class="field">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}
    {% if field.name in locked %}{% icon "lock" "lock small" %}{% endif %}</label>
  {{ field }}
{% endif %}
  {% if field.help_text %}<div class="field__help">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="field__error">{{ error }}</div>{% endfor %}
</div>
