{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Attnd</title>
  <link rel="stylesheet" href="{% static 'console/console.css' %}">
</head>
<body class="bg-light">
<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm" style="width:100%;max-width:420px;">
    <div class="card-body p-4">
      <h2 class="card-title mb-4 text-center">Sign in to Attnd</h2>
      {% if rate_limited %}<div class="alert alert-warning py-2" role="alert">{{ rate_limited }}</div>
      {% elif form.errors %}<div class="alert alert-danger py-2">That email and password didn’t match.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3"><label class="form-label" for="id_username">Email</label>
          <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" autofocus required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Password</label>
          <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
        <p class="small text-end mt-n2 mb-3"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
        <div class="d-grid"><button class="btn btn-primary">Sign in</button></div>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">New here? <a href="{% url 'console:signup' %}">Create an account</a></p>
    </div>
  </div>
</div>
</body>
</html>
