{% load static console_tags %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Attnd</title>
  <link rel="stylesheet" href="{% static 'console/console.css' %}">
</head>
<body>
<main class="page page--centered">
  <div class="panel panel--narrow stack">
    <h1 class="auth-title">Sign in to Attnd</h1>
    {% if rate_limited %}<div class="notice notice--warning notice--compact" role="alert">{{ rate_limited }}</div>
    {% elif form.errors %}<div class="notice notice--error notice--compact">That email and password didn’t match.</div>{% endif %}
    <div data-passkey-signin data-passkey-scope data-options-url="{% url 'passkey_auth_options' %}"
         data-verify-url="{% url 'passkey_auth' %}" data-next="{{ next }}">
      <div class="notice notice--error notice--compact" role="alert" data-passkey-error hidden></div>
      <div class="stack stack--tight" data-passkey-ui hidden>
        <button type="button" class="button button--primary button--block" data-passkey-button>{% icon "key" %} Sign in with a passkey</button>
        <p class="center small muted">or with your email and password</p>
      </div>
    </div>
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label class="field__label" for="id_username">Email</label>
        <input type="text" name="username" id="id_username" autocomplete="username webauthn" autofocus required></div>
      <div class="field"><label class="field__label" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <p class="form-note small end"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
      <button class="button button--outline button--block">Sign in</button>
    </form>
    <p class="center small muted">New here? <a href="{% url 'console:signup' %}">Create an account</a></p>
  </div>
</main>
<script src="{% static 'console/passkeys.js' %}"></script>
</body>
</html>
