# Push types the server sends (data `type`), events/push.py.
[push_types]
notification = "an organizer notification (alert; urgent ones time-sensitive, plus Live Activity pushes)"
content_updated = "silent: refetch bundle/ (jitter_ms, preview phones 0)"

# Hosts the code names without calling them (documentation links, schema ids, examples, form placeholders).
[ignore_hosts]
"attnd.app" = "our own host"
"dev.attnd.app" = "our own dev host"
"attnd.site" = "our own sites host"
"dev.attnd.site" = "our own dev sites host"
"schema.org" = "JSON-LD @context, never fetched"
"docs.djangoproject.com" = "a comment"
"example.org" = "demo data"
"example.com" = "examples"
"yourevent.com" = "a form placeholder"

# Flows: drawn step by step on the diagram (Reduce Motion: a numbered list).
[[flow]]
id = "join"
label = "QR → App Clip → join → bundle"
steps = [["public_web", "A visitor scans the join QR (or opens the link)"],
         ["app_clip", "iPhone opens the App Clip (Android: Play, then the install referrer)"],
         ["heroku_router", "POST events/<id>/join/ with the device id"],
         ["events", "Free limit checked, the device registered"],
         ["postgres", "GET bundle/ answered from the published copy (304 when unchanged)"]]

[[flow]]
id = "import"
label = "AI import"
steps = [["console_browser", "An organizer pastes a website or drops a flyer"],
         ["scrape", "An IngestJob crawls the site through the SSRF-guarded fetcher"],
         ["anthropic", "Claude Haiku extracts locations, schedule, details"],
         ["google_geocoding", "Addresses become coordinates"],
         ["postgres", "The event is created; place photos and colours follow in the background"]]

[[flow]]
id = "watching"
label = "Website watching"
steps = [["heroku_router", "The scheduler runs every 10 minutes"],
         ["scrape", "Changed pages only (conditional GET + hash)"],
         ["anthropic", "The AI re-reads them with the current data"],
         ["console_browser", "A change set waits for review (or applies in auto mode)"]]

[[flow]]
id = "urgent"
label = "Urgent notification"
