# Attnd's architecture: the parts code can't see (apps, hosting, DNS, outside services) and how they connect.
# Read by platform_admin/architecture.py (Platform → Architecture) together with what it generates from the code
# (Django apps, models, URLs, API v2 endpoints, push types, Ask Attnd actions, integrations configured).
# TOML, not YAML: the standard library reads TOML (tomllib) and we add no dependencies.
#
# Adding an integration = add it here (a node with its hosts and env vars). attnd/tests_architecture.py fails CI
# when a Django app, an outside host the code calls, a settings env var or a push type is missing from this file.
#
# layers: clients · edge · apps · data · external      tags: infra · data · ai · push · store · web · mail · pay

[[node]]
id = "ios_app"
label = "iOS app"
layer = "clients"
tags = ["store", "push"]
description = "SwiftUI app (iOS 26+, iPhone and iPhone Duo): API v2, App Attest, APNs, Live Activities, on-device Foundation Models."
docs = "https://github.com/apbeers/Attnd-iOS/blob/develop/CLAUDE.md"
code = ["Attnd-iOS: Attnd/"]
edges = [{ to = "heroku_router", label = "API v2 (bundle, join, usage)", protocol = "HTTPS JSON", auth = "App Attest JWT" },
         { to = "apns", label = "device + Live Activity tokens", protocol = "APNs", auth = "Apple" }]

[[node]]
id = "claude_mcp"
label = "Claude (MCP client)"
layer = "clients"
tags = ["ai"]
description = "Claude on the web, Desktop, mobile, Cowork and Claude Code, connected as a staff member through OAuth (docs/mcp_plan.md). Identifies itself with a Client ID Metadata Document on claude.ai; the hosted apps come back on claude.ai/api/mcp/auth_callback."
docs = "https://claude.com/docs/connectors/building/authentication.md"
code = ["mcp_server/server.py", "mcp_server/oauth.py"]
hosts = ["claude.ai", "claude.com"]
edges = [{ to = "heroku_router", label = "/mcp (tools, MCP Apps) + /oauth/", protocol = "MCP Streamable HTTP", auth = "OAuth bearer" }]

[[node]]
id = "app_clip"
label = "App Clip"
layer = "clients"
tags = ["store", "push"]
description = "The same code as the iOS app, opened from the join QR / link with nothing to install (no silent pushes: 60 s poll)."
docs = "https://github.com/apbeers/Attnd-iOS/blob/develop/CLAUDE.md"
code = ["Attnd-iOS: AttndAppClip/"]
edges = [{ to = "heroku_router", label = "API v2", protocol = "HTTPS JSON", auth = "App Attest JWT" }]

[[node]]
id = "ios_widgets"
label = "Live Activity widgets"
layer = "clients"
tags = ["push"]
description = "AttndWidgets / AttndClipWidgets: the Lock Screen Live Activity, Dynamic Island, Watch Smart Stack."
code = ["Attnd-iOS: AttndWidgets/"]
edges = [{ to = "apns", label = "liveactivity pushes (urgent)", protocol = "APNs", auth = "Apple" }]

[[node]]
id = "android_app"
label = "Android app"
layer = "clients"
tags = ["store", "push"]
description = "Kotlin + Compose (Android 15+): API v2, Play Integrity, FCM, Live Updates."
