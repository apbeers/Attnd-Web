[[node]]
id = "dns"
label = "DNS (Namecheap)"
layer = "edge"
tags = ["infra"]
description = "attnd.app (console, API, site; dev.attnd.app) and attnd.site (Studio sites; dev.attnd.site); Mailgun's mg.attnd.app records."
code = ["SETUP.md"]
edges = [{ to = "heroku_router", label = "CNAME", protocol = "DNS", auth = "" }]

